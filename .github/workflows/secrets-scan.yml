name: Secrets scan

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  betterleaks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install betterleaks
        env:
          BETTERLEAKS_VERSION: 1.8.1
          BETTERLEAKS_SHA256: efa407244e1ea8e35f582b8a42becdeac08bdead04f68eb752adda722d583c2a
        run: |
          curl --fail --location --silent --show-error \
            --output betterleaks.tar.gz \
            "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${BETTERLEAKS_SHA256}  betterleaks.tar.gz" | sha256sum --check
          tar --extract --gzip --file betterleaks.tar.gz --directory /usr/local/bin betterleaks

      - name: Scan for secrets
        run: |
          betterleaks git . \
            --baseline-path .github/betterleaks-baseline.json \
            --log-level warn
